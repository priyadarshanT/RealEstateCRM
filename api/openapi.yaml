          - unassigned
          - deleted
          - new
          - pending
          - scheduled
          - overdue
          - cold
      - name: q
        in: query
        schema:
          type: string
        description: Name, phone or email
      - name: stageId
        in: query
        schema:
          type: string
          format: uuid
      - name: ownerUserId
        in: query
        schema:
          type: string
          format: uuid
      - name: teamId
        in: query
        schema:
          type: string
          format: uuid
      - name: projectId
        in: query
        schema:
          type: string
          format: uuid
      - name: sourceId
        in: query
        schema:
          type: string
          format: uuid
      - name: campaignId
        in: query
        schema:
          type: string
          format: uuid
      - name: eventId
        in: query
        schema:
          type: string
          format: uuid
      - name: budgetMin
        in: query
        schema:
          type: string
          pattern: ^-?\d+(\.\d{1,2})?$
          description: Decimal as string, 2 places
          example: '3250000.00'
      - name: budgetMax
        in: query
        schema:
          type: string
          pattern: ^-?\d+(\.\d{1,2})?$
          description: Decimal as string, 2 places
          example: '3250000.00'
      - name: createdFrom
        in: query
        schema:
          type: string
          format: date
      - name: createdTo
        in: query
        schema:
          type: string
          format: date
      - name: savedFilterId
        in: query
        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        schema:
          type: string
        description: 'Default: -score,nextFollowUpAt'
      - name: total
        in: query
        schema:
          type: boolean
