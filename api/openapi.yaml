      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /users/{id}/receives-leads:
    put:
      tags:
      - Organization
      summary: Turn lead assignment on or off
      operationId: turnLeadAssignmentOnOrOff
      description: 'Admin switch. When off, the user keeps existing leads but gets no new ones.


        **Permission:** `users.lead_assignment`'
      x-permission: users.lead_assignment
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - receivesLeads
              properties:
                receivesLeads:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
