openapi: 3.1.0
info:
  title: Dubai Real Estate CRM API
  version: 1.2.0
  description: 'REST API for the Dubai Real Estate CRM (matches SRS v1.2).


    - Base URL: `https://crm.example.ae/api/v1` (staging: `https://staging.crm.example.ae/api/v1`)

    - Auth: `Authorization: Bearer <Cognito access token>`; two-factor login is required.

    - Every request is limited to the user''s tenant and data scope.

    - JSON fields use camelCase; times are ISO 8601 UTC; money is a decimal string.

    - Subscription: when a company is read-only (unpaid after the 14-day grace) every change returns 402 SUBSCRIPTION_READ_ONLY;
    reading and exporting still work. A suspended company gets 403 TENANT_SUSPENDED.

    - Owner console (`/platform/...`) uses a separate login for the platform team.

    - In the running app, Swagger UI is served at `/api/docs` from this contract.'
servers:
- url: https://crm.example.ae/api/v1
  description: Production
- url: https://staging.crm.example.ae/api/v1
  description: Staging
- url: http://localhost:4000/api/v1
  description: Local
security:
- bearer: []
tags:
- name: Session
- name: Organization
- name: Settings
- name: Leads
- name: Assignment
- name: Marketing
- name: Tasks
- name: Meetings
- name: Public booking
- name: Messaging
- name: Projects
- name: Deals
- name: Finance
- name: Attendance
- name: Dashboard
- name: Reports
- name: Integrations
- name: Files
- name: Notifications
- name: Audit
- name: Public sign-up
- name: Subscription & billing
- name: Owner console
- name: Webhooks (inbound)
paths:
  /me:
    get:
      tags:
      - Session
      summary: Get current user
      operationId: getCurrentUser
      description: 'Who I am, my tenant, my permissions and data scope. The screens use this to show or hide menu items and
        buttons.


        **Permission:** `(any signed-in user)`'
      x-permission: (any signed-in user)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /organization:
    get:
      tags:
      - Organization
      summary: Get organization profile
      operationId: getOrganizationProfile
      description: '**Permission:** `(any signed-in user)`'
      x-permission: (any signed-in user)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
    patch:
      tags:
      - Organization
      summary: Update organization profile
      operationId: updateOrganizationProfile
      description: '**Permission:** `settings.manage`'
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tenant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /users:
    get:
      tags:
      - Organization
      summary: List users
      operationId: listUsers
      description: '**Permission:** `users.manage`'
      x-permission: users.manage
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - invited
          - active
          - inactive
      - name: roleId
        in: query
        schema:
          type: string
          format: uuid
      - name: teamId
        in: query
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        schema:
          type: string
        description: Search name or email
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
    post:
      tags:
      - Organization
      summary: Create user
      operationId: createUser
      description: '**Permission:** `users.manage`


        422 SEAT_LIMIT_REACHED when all paid seats are used (invited users do not use a seat until they accept).'
      x-permission: users.manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /users/{id}:
