<title>CRM Requirements (SRS)</title>

<style>
/* Layout: one reading column for the SRS; wireframes break out wider inside scrollable frames */
:root{--bg:#f5f7f8;--surface:#fff;--ink:#16232b;--muted:#5d6d78;--line:#dfe5e8;--accent:#0d8a80;--accent-soft:#dff3f1;
 --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

:root[data-theme="dark"]{--bg:#0f171c;--surface:#16222a;--ink:#e5edf1;--muted:#98a9b3;--line:#27353e;--accent:#45c4b8;--accent-soft:#163331;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px}
.doc{max-width:1100px;margin:0 auto;padding-block:36px 72px}
.doc>*:not(figure){max-width:820px}

ol,ul{padding-left:22px} li{margin:3px 0}

pre.mermaid{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto}
