      security: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from page.nextCursor
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 100
      description: Optional. Retrying a POST with the same key returns the first result instead of creating a duplicate.
    IfMatch:
      name: If-Match
      in: header
      schema:
        type: string
      description: Optional ETag (version) for optimistic locking
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or expired token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: No permission or outside data scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (or not visible to you)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicts with current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business rule failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PaymentRequired:
      description: Company is read-only (unpaid after the grace period) or suspended
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PageInfo:
      type: object
      properties:
        nextCursor:
          oneOf:
          - type: string
          - type: 'null'
        hasMore:
          type: boolean
        total:
          type: integer
          description: Present only when total=true is requested
      required:
      - hasMore
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine code, e.g. LEAD_EXISTS
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        requestId:
          type: string
      required:
      - title
      - status
      - code
      description: Error body (RFC 9457 problem details)
    IdRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tenant:
          $ref: '#/components/schemas/Tenant'
        permissions:
          type: array
          items:
            type: string
        dataScope:
          type: string
          enum:
          - own
          - team
          - division
          - company
      required:
      - user
      - tenant
      - permissions
      - dataScope
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          enum:
          - brokerage
          - individual
        name:
          type: string
        legalName:
          type: string
        tradeLicenseNo:
          type: string
        reraOrn:
          type: string
        reraBrn:
          type: string
        tradeLicenseFileId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        verificationStatus:
          type: string
          enum:
          - pending
          - verified
          - rejected
          readOnly: true
        trn:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        website:
          type: string
        logoFileId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        timezone:
          type: string
        baseCurrency:
          type: string
          pattern: ^[A-Z]{3}$
          example: AED
      required:
      - id
      - type
      - name
      - timezone
      - baseCurrency
      - verificationStatus
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
